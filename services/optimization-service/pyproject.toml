[project]
name = "optimization-service"
version = "0.1.0"
description = "Optimization API — Phase 5 skeleton: routing, DTOs, and layering, no real optimization logic yet."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires calling Depends()/Query()/etc. as
# argument defaults — that's idiomatic here, not the mutable-default footgun B008
# otherwise warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
