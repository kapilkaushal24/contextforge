[project]
name = "aito-providers"
version = "0.1.0"
description = "IAIProvider adapters (OpenAI, Anthropic) over httpx."
requires-python = ">=3.12"
dependencies = ["optimization-core", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aito_providers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
